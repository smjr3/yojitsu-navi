# 予実ナビ — GitLab CI/CD
#
# パイプライン:
#   validate → test → build → pages
#   - validate : データ検証（scripts/validate-data.ts）。error があれば止める
#   - test     : 型チェック + vitest（ユニット・プロパティ・結合）
#   - build    : Observable Framework で dist/ を生成
#   - pages    : 既定ブランチのみ。dist/ を public/ として GitLab Pages に公開
#   - fetch-worklogs : スケジュール実行時のみ。作業実績 API から直近 N か月を取り直して
#                      data/worklogs/ をコミット＆プッシュする（その push が通常パイプラインを起動し、
#                      validate → … → pages まで流れる）
#
# 必要な CI/CD 変数（Settings > CI/CD > Variables、Masked 推奨）:
#   WORKLOG_API_TOKEN   作業実績 API の認証トークン（http アダプタが使う。ログには出ない）
#   MEMBER_FETCH_ENABLED（任意）"1" にするとスケジュール実行で fetch-members（所属・役職の取り込み）も動く。既定は無効
#   MEMBER_API_TOKEN    （任意）人事 API の認証トークン（memberSource.adapter = http のとき）
#   GIT_PUSH_TOKEN      data/worklogs を書き戻すための Project Access Token（role: Developer、scope: write_repository）
#   NPM_CONFIG_REGISTRY （任意）社内ミラーの npm レジストリ URL。例: https://nexus.example.local/repository/npm/
#   PLAYWRIGHT_E2E      （任意）"1" にすると build 後に E2E（Playwright）も実行する（ブラウザの取得に外部接続が要る）
#   NODE_IMAGE          （任意）Node のイメージ。Docker Hub に出られないときは社内レジストリのものを指定する
#
# 外部ネットワーク:
#   - 画面は外部 CDN を一切使わない（ライブラリは dist/ に同梱）
#   - ビルドも外部に出ない（npm の prebuild で scripts/seed-npm-cache.mjs が Framework のバージョン問い合わせを止める）
#   - 外に出るのは npm ci（NPM_CONFIG_REGISTRY で社内ミラーに向けられる）とイメージの取得だけ
#   - 手順は docs/DEPLOY_GITLAB.md
#
# 注意:
#   - Pages のジョブ名は必ず `pages`、成果物は `public/` にする（GitLab の仕様）
#   - 社内 GitLab のイメージレジストリ経由で node:22 を使う場合は CI/CD 変数 NODE_IMAGE で差し替える

image: $NODE_IMAGE

stages:
  - validate
  - test
  - build
  - pages

variables:
  # CI/CD 変数で上書きできる（例: registry.gitlab.example.local/mirror/node:22）
  NODE_IMAGE: "node:22"
  # npm のキャッシュをプロジェクト内に置いて cache: で共有する
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Playwright のブラウザもキャッシュ対象
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"
  GIT_DEPTH: "20"

# node_modules と npm キャッシュを lock ファイル単位で共有する
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/
    - .cache/ms-playwright/

default:
  before_script:
    # 社内ミラーがあれば NPM_CONFIG_REGISTRY を変数で渡すだけで切り替わる（npm が自動で読む）
    - if [ -n "$NPM_CONFIG_REGISTRY" ]; then echo "npm registry: $NPM_CONFIG_REGISTRY"; fi
    - npm ci --prefer-offline --no-audit --no-fund

# スケジュール実行以外（push / MR / 手動）で動く共通条件
.normal-rules: &normal-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --------------------------------------------------------------------------
# validate: データの整合性チェック（契約ID重複・期間逆転・未知のチーム等で止める）
# --------------------------------------------------------------------------
validate:
  stage: validate
  <<: *normal-rules
  script:
    - npm run validate

# --------------------------------------------------------------------------
# test: 型チェックとテスト
# --------------------------------------------------------------------------
test:
  stage: test
  <<: *normal-rules
  script:
    - npm run typecheck
    # JUnit 形式のレポートも出して GitLab のテスト結果タブに表示する
    - npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml
  artifacts:
    when: always
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# --------------------------------------------------------------------------
# build: 静的サイトを dist/ に生成
# --------------------------------------------------------------------------
build:
  stage: build
  <<: *normal-rules
  variables:
    # マスタ編集（src/data/masters.json.ts）が各 CSV の最終コミット ID を履歴から取るため、浅いクローンにしない
    # （浅いと ID を取れず、GitLab 保存時の競合検出が効かない）
    GIT_DEPTH: "0"
  script:
    - npm run build
    # E2E は任意（PLAYWRIGHT_E2E=1 のとき）。tests/e2e/playwright.config.ts が無ければスキップ
    - |
      if [ "$PLAYWRIGHT_E2E" = "1" ] && [ -f tests/e2e/playwright.config.ts ]; then
        npx playwright install --with-deps chromium
        npm run test:e2e
      else
        echo "E2E はスキップ（PLAYWRIGHT_E2E 未設定または tests/e2e/playwright.config.ts が無い）"
      fi
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# --------------------------------------------------------------------------
# pages: 既定ブランチの dist/ を public/ として公開
# --------------------------------------------------------------------------
pages:
  stage: pages
  needs: ["build"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # build の成果物を移すだけなので、リポジトリの取得・npm ci・キャッシュは不要
  variables:
    GIT_STRATEGY: none
  before_script: []
  cache: []
  script:
    - test -f dist/index.html || { echo "dist/index.html がありません（build ジョブの成果物を確認）"; exit 1; }
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public/
  # 公開先は https://<group>.pages.example/<project>/（サブパス配信。observablehq.config.js 側で相対パスを使う）
  # 閲覧制限は Settings > General > Visibility > Pages = Only Project Members（docs/DEPLOY_GITLAB.md）
  environment:
    name: pages
    url: $CI_PAGES_URL

# --------------------------------------------------------------------------
# fetch-worklogs: スケジュール実行（例: 平日 06:00）で作業実績を取り直し、リポジトリに書き戻す
#   Settings > CI/CD > Schedules で cron を登録する（対象ブランチ = 既定ブランチ）
# --------------------------------------------------------------------------
fetch-worklogs:
  stage: validate
  resource_group: data-writeback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_STRATEGY: clone
  script:
    - test -n "$WORKLOG_API_TOKEN" || { echo "WORKLOG_API_TOKEN が未設定です"; exit 1; }
    - test -n "$GIT_PUSH_TOKEN" || { echo "GIT_PUSH_TOKEN が未設定です"; exit 1; }
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    # 直近 refetchMonths か月を取り直して data/worklogs/ を更新
    - npm run fetch
    # 取り直した結果で検証が通ることを確認してから書き戻す
    - npm run validate
    - git config user.name "yojitsu-navi-bot"
    - git config user.email "yojitsu-navi-bot@example.local"
    - git add data/worklogs
    - |
      if git diff --cached --quiet; then
        echo "作業実績に変更はありません"
      else
        git commit -m "chore(data): 作業実績を更新 ($(date -u +%Y-%m-%dT%H:%MZ)) [skip schedule]"
        # トークンは URL に埋め込むがログには出ない（set -x しない）。push が通常パイプラインを起動し、build → pages まで進む
        git push "https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"
      fi

# --------------------------------------------------------------------------
# fetch-members: 所属・役職を人事データから取り込み、data/masters/members.csv に書き戻す
#   既定は無効。スケジュール実行 かつ CI/CD 変数 MEMBER_FETCH_ENABLED=1 のときだけ動く。
#   config.json の memberSource.adapter が none のままなら何もしない（変更なし）。
#   変わった人だけ実行月の行が追加される（冪等）。fetch-worklogs と同時に書き戻さないよう resource_group を共有する
# --------------------------------------------------------------------------
fetch-members:
  stage: validate
  resource_group: data-writeback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MEMBER_FETCH_ENABLED == "1"
  variables:
    GIT_STRATEGY: clone
  script:
    - test -n "$GIT_PUSH_TOKEN" || { echo "GIT_PUSH_TOKEN が未設定です"; exit 1; }
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - npm run fetch:members
    - npm run validate
    - git config user.name "yojitsu-navi-bot"
    - git config user.email "yojitsu-navi-bot@example.local"
    - git add data/masters/members.csv
    - |
      if git diff --cached --quiet; then
        echo "メンバーに変更はありません"
      else
        git commit -m "chore(data): メンバーの所属・役職を更新 ($(date -u +%Y-%m-%dT%H:%MZ)) [skip schedule]"
        # fetch-worklogs が先に書き戻していても取り込めるよう、data は衝突しないので rebase してから push する
        git pull --rebase "https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${CI_COMMIT_BRANCH}"
        git push "https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"
      fi
