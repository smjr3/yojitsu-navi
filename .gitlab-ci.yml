# 予実ナビ — GitLab CI/CD
#
# パイプライン:
#   build → pages（test は既定で動かさない）
#   - test     : 型チェック + 運用のテスト（取り込み・データ検証・CI のスクリプト。SPEC §93）。既定は動かさない（CI/CD 変数 YOJITSU_RUN_TESTS=1 のときだけ）。
#                アプリ本体のテスト（計算・画面・パッケージ・性能など）は開発元で公開前に済ませていて、このプロジェクトには入っていない。
#                導入先で変わるのはデータと config.json だけで、それは build（データ検証を含む）と取り込みで確かめる（SPEC §79.2）。
#                テストは本番の config.json・data/ を使わない（設定はテストの中、データは tests/fixtures/）
#   - build    : データ検証（scripts/validate-data.ts。error があれば止める）→ Observable Framework で dist/ を生成。
#                検証とビルドを 1 つのジョブにして、依存の取得（npm ci）を 1 回にする（Windows の Runner では 1 回に数分かかる。SPEC §79.3）
#   - pages    : 既定ブランチのみ。dist/ を public/ として GitLab Pages に公開
#   - fetch-worklogs : スケジュール実行時のみ。作業実績 API から直近 N か月を取り直し、
#                      data/worklogs/ の変更を MR にして自動マージする（main は直接プッシュ不可のため。
#                      マージで通常パイプラインが走り、build → pages まで流れる）
#
# 推奨のプロジェクト構成・権限・保護ブランチは docs/DEPLOY_GITLAB.md（SPEC §39）。
# 設定の確認・適用は `npm run gitlab:setup`（scripts/gitlab-setup.ts）
#
# 必要な CI/CD 変数（Settings > CI/CD > Variables、Masked 推奨）:
#   WORKLOG_API_TOKEN   作業実績 API の認証トークン（http アダプタが使う。ログには出ない）
#   MEMBER_FETCH_ENABLED（任意）"1" にするとスケジュール実行で fetch-members（所属・役職の取り込み）も動く。既定は無効
#   MEMBER_API_TOKEN    （任意）人事 API の認証トークン（memberSource.adapter = http のとき）
#   FETCH_FROM / FETCH_TO / FETCH_MEMBERS（任意。Run pipeline で入れる。CI/CD 変数には登録しない）過去の作業実績の取り直し（§87）
#   GIT_PUSH_TOKEN      data/ の取り込み結果を MR で反映するための Project Access Token
#                       （role: Maintainer = 自動マージに必要、scope: write_repository。Protected + Masked）
#   NPM_CONFIG_REGISTRY （任意）社内ミラーの npm レジストリ URL。例: https://nexus.example.local/repository/npm/
#   YOJITSU_RUN_TESTS   （任意）"1" にすると test ジョブ（型チェック・運用のテスト）も動く。既定は動かさない
#   NODE_IMAGE          （任意）Node のイメージ。Docker Hub に出られないときは社内レジストリのものを指定する
#   NODE_EXTRA_CA_CERTS （任意）社内の証明書（PEM）。種類を File にして中身を貼る（npm・Node がこの証明書も信頼する）
#   以下 2 つは YOJITSU_RUN_TESTS=1 のときだけ使う
#   VITEST_MAX_FORKS    （任意）テストを同時に動かす数（既定 Windows 2・Linux は CPU の数 - 1）。Windows でワーカーのタイムアウトが出るとき 1
#   YOJITSU_TEST_TIMEOUT_SCALE（任意）テストのタイムアウトの倍率（既定 Windows 3・Linux 1）。手順は docs/OPERATIONS.md
#
# 外部ネットワーク:
#   - 画面は外部 CDN を一切使わない（ライブラリは dist/ に同梱）
#   - ビルドも外部に出ない（npm の prebuild で scripts/seed-npm-cache.mjs が Framework のバージョン問い合わせを止める）
#   - 外に出るのは npm ci（NPM_CONFIG_REGISTRY で社内ミラーに向けられる。依存込みで作ったプロジェクトは vendor/npm-cache から入れるので出ない）とイメージの取得だけ
#   - 手順は docs/DEPLOY_GITLAB.md
#
# Runner の OS:
#   - Windows・Linux のどちらの Runner でも動く（社内の Runner は Windows。Linux に変わってもこのままでよい）。
#     そのため script には OS ごとのシェル（sh / PowerShell）で書き方が変わるもの（if・変数の展開・find など）を書かず、
#     node scripts/ci/*.mjs と npm run だけを並べる。変数は variables: で渡す
#   - image: は Docker executor のときだけ使われる（shell executor では無視され、Runner のマシンの Node を使う）
#
# 注意:
#   - Pages のジョブ名は必ず `pages`、成果物は `public/` にする（GitLab の仕様）
#   - 社内 GitLab のイメージレジストリ経由で node:22 を使う場合は CI/CD 変数 NODE_IMAGE で差し替える

image: $NODE_IMAGE

# 社内向けの設定（ランナーのタグ・社内だけのジョブなど）は .gitlab-ci.local.yml に書く。update はそのファイルを上書きしない（SPEC §91.1）。
# レジストリ・証明書・イメージは CI/CD 変数（NPM_CONFIG_REGISTRY・NODE_EXTRA_CA_CERTS・NODE_IMAGE）か .npmrc で渡す
include:
  - local: .gitlab-ci.local.yml

# パイプラインの重複を防ぐ: MR があるブランチへの push は MR のパイプラインだけにする
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - test
  - build
  - pages

variables:
  # CI/CD 変数で上書きできる（例: registry.gitlab.example.local/mirror/node:22）
  NODE_IMAGE: "node:22"
  # npm のキャッシュをプロジェクト内に置いて cache: で共有する
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: "20"

# npm のダウンロードキャッシュを lock ファイル単位で共有する。
# node_modules/ は入れない（npm ci は毎回 node_modules を消して入れ直すので、固めて戻す時間がまるごと無駄になる。
# Windows の Runner ではファイル数の多い node_modules の圧縮・展開だけで数分かかる。SPEC §79.3）
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    # npm ci。依存込みのパッケージ（yojitsu-navi-<版>-with-deps.tgz）で作ったプロジェクトは、同梱のキャッシュだけで入れる
    # （npm ci --offline --cache vendor/npm-cache。外に出ない。SPEC §44）。社内ミラーは NPM_CONFIG_REGISTRY で切り替わる
    - node scripts/ci/install.mjs

# スケジュール実行以外（push / MR / 手動）で動く共通条件
.normal-rules: &normal-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# --------------------------------------------------------------------------
# test: 型チェックとテスト。既定は動かさない（CI/CD 変数 YOJITSU_RUN_TESTS=1、または Run pipeline で入れたときだけ）
#   アプリ本体の確認はパッケージの公開前に済ませている。社内の Runner で本体を確かめたいとき（版を上げた直後など）に使う
# --------------------------------------------------------------------------
test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $YOJITSU_RUN_TESTS != "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  # Windows の Runner では同時に動かすテストを 2 つにしている（vitest.config.ts）。それでもワーカーのタイムアウトが出るときは
  # CI/CD 変数 VITEST_MAX_FORKS を 1 にする（docs/OPERATIONS.md、SPEC §79.1）
  script:
    - npm run typecheck
    # JUnit 形式のレポートも出して GitLab のテスト結果タブに表示する
    - npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml
  artifacts:
    when: always
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# --------------------------------------------------------------------------
# build: データの整合性チェック（案件ID重複・期間逆転・未知のチーム等で止める）→ 静的サイトを dist/ に生成
# --------------------------------------------------------------------------
build:
  stage: build
  <<: *normal-rules
  variables:
    # マスタ編集（src/data/masters.json.ts）が各 CSV の最終コミット ID を履歴から取るため、浅いクローンにしない
    # （浅いと ID を取れず、GitLab 保存時の競合検出が効かない）
    GIT_DEPTH: "0"
    # マスタ編集の保存先（config.json の apiBaseUrl・projectId が空のとき）をこのプロジェクトにする（§39.1）
    YOJITSU_GITLAB_API_URL: $CI_API_V4_URL
    YOJITSU_GITLAB_PROJECT: $CI_PROJECT_PATH
  script:
    - npm run validate
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# --------------------------------------------------------------------------
# pages: 既定ブランチの dist/ を public/ として公開
# --------------------------------------------------------------------------
pages:
  stage: pages
  needs: ["build"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # build の成果物を移すだけなので、npm ci・キャッシュは不要（移すスクリプトのためにリポジトリは浅く取る）
  variables:
    GIT_DEPTH: "1"
  before_script: []
  cache: []
  script:
    # dist/ を public/ に移し、圧縮版（.gz）を並べる（GitLab Pages が gzip で配信し、約 3 MB の JSON が数百 KB になる）
    - node scripts/ci/pages.mjs
  artifacts:
    paths:
      - public/
  # 公開先は https://<group>.pages.example/<project>/（サブパス配信。observablehq.config.js 側で相対パスを使う）
  # 閲覧制限は Settings > General > Visibility > Pages = Only Project Members（docs/DEPLOY_GITLAB.md）
  environment:
    name: pages
    url: $CI_PAGES_URL

# --------------------------------------------------------------------------
# fetch-worklogs: スケジュール実行（例: 平日 06:00）で作業実績を取り直し、MR で反映する
#   Settings > CI/CD > Schedules で cron を登録する（対象ブランチ = 既定ブランチ）
# --------------------------------------------------------------------------
fetch-worklogs:
  stage: validate
  resource_group: data-writeback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # 過去の取り直し（§87）: Run pipeline で FETCH_FROM / FETCH_TO（YYYY-MM）、必要なら FETCH_MEMBERS（社員番号）を入れて実行
    - if: $CI_PIPELINE_SOURCE == "web" && $FETCH_FROM
  variables:
    GIT_STRATEGY: clone
  script:
    # 直近 refetchMonths か月（手動実行なら FETCH_FROM〜FETCH_TO）を取り直して data/worklogs/ を更新 → 検証 →
    # 取得に失敗したら CSV は書き換えず、失敗の記録（_meta.json）だけを MR にしてジョブを失敗にする（データ確認画面に出る）
    # main は直接プッシュ不可（保護ブランチ）なので、data/worklogs-<日時> の MR を作って自動マージする（scripts/ci/push-data-mr.mjs）
    - node scripts/ci/fetch-data.mjs worklogs

# --------------------------------------------------------------------------
# fetch-members: 所属・役職を人事データから取り込み、data/masters/members.csv に書き戻す
#   既定は無効。スケジュール実行 かつ CI/CD 変数 MEMBER_FETCH_ENABLED=1 のときだけ動く。
#   config.json の memberSource.adapter が none のままなら何もしない（変更なし）。
#   変わった人だけ実行月の行が追加される（冪等）。fetch-worklogs と同時に動かないよう resource_group を共有する
# --------------------------------------------------------------------------
fetch-members:
  stage: validate
  resource_group: data-writeback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MEMBER_FETCH_ENABLED == "1"
  variables:
    GIT_STRATEGY: clone
  script:
    # fetch:members → 検証 → fetch-worklogs とは別の MR（data/members-<日時>）。触るファイルが違うので互いに競合しない
    - node scripts/ci/fetch-data.mjs members
