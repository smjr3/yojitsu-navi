# 予実ナビ — GitLab CI/CD
#
# パイプライン（変わったファイルを見て、要るジョブだけを GitLab が選ぶ。SPEC §102.3）:
#   MR       : プログラム（src/・scripts/・package.json など）が変わった → build（検証つき。公開はしない）
#              データ（data/・config.json）だけが変わった              → validate（データ検証だけ。ビルドしない）
#              それ以外（文書・CI の設定など）だけ                     → ci-check（CI の設定の点検だけ。依存も取らない）
#   既定ブランチへの push（MR のマージ・自動取り込みのマージ）:
#              プログラム・データ・CI の設定のどれかが変わった         → build → pages
#              文書だけ                                                → 何も動かない（公開中のサイトはそのまま）
#   Run pipeline（手動）・API: build → pages（既定ブランチのとき）。test は既定で動かさない
#   - validate : データ検証（scripts/validate-data.ts。error があれば止める）。MR のパイプラインだけ
#   - ci-check : CI 定義が使うファイルが揃っているか・GitLab が受け付けない書き方が無いか（scripts/ci/check.mjs）。MR のパイプラインだけ
#   - test     : 型チェック + 運用のテスト（取り込み・データ検証・CI のスクリプト。SPEC §93）。既定は動かさない（CI/CD 変数 YOJITSU_RUN_TESTS=1 のときだけ）。
#                アプリ本体のテスト（計算・画面・パッケージ・性能など）は開発元で公開前に済ませていて、このプロジェクトには入っていない。
#                導入先で変わるのはデータと config.json だけで、それは build（データ検証を含む）と取り込みで確かめる（SPEC §79.2）。
#                テストは本番の config.json・data/ を使わない（設定はテストの中、データは tests/fixtures/）
#   - build    : データ検証 → Observable Framework で dist/ を生成。
#                検証とビルドを 1 つのジョブにして、依存の取得（npm ci）を 1 回にする（Windows の Runner では 1 回に数分かかる。SPEC §79.3）。
#                ビルドは増分（SPEC §102）: ローダのキャッシュを cache: でパイプラインをまたいで使い回し、データだけが変わったときは
#                変わった出力だけを作り直す。プログラムが変わったときと、CI/CD 変数 YOJITSU_FULL_BUILD=1 のときはフルビルド
#   - pages    : 既定ブランチのみ。dist/ を public/ として GitLab Pages に公開
#   - fetch-worklogs : スケジュール実行時のみ。作業実績 API から直近 N か月を取り直し、
#                      data/worklogs/ の変更を MR にして自動マージする（main は直接プッシュ不可のため。
#                      MR では validate だけが動き、マージで既定ブランチの build → pages まで流れる）
#
# 推奨のプロジェクト構成・権限・保護ブランチは docs/DEPLOY_GITLAB.md（SPEC §39）。
# 設定の確認・適用は `npm run gitlab:setup`（scripts/gitlab-setup.ts）
#
# 必要な CI/CD 変数（Settings > CI/CD > Variables、Masked 推奨）:
#   WORKLOG_API_TOKEN   作業実績 API の認証トークン（http アダプタが使う。ログには出ない）
#   MEMBER_FETCH_ENABLED（任意）"1" にするとスケジュール実行で fetch-members（所属・役職の取り込み）も動く。既定は無効
#   MEMBER_API_TOKEN    （任意）人事 API の認証トークン（memberSource.adapter = http のとき）
#   PROJECT_FETCH_ENABLED（任意）"1" にするとスケジュール実行で fetch-projects（正式な案件の一覧の取り込み。§98）も動く。既定は無効
#   PROJECT_API_TOKEN   （任意）外部の案件管理 API の認証トークン（projectSource.adapter = http のとき）
#   FETCH_FROM / FETCH_TO / FETCH_MEMBERS（任意。Run pipeline で入れる。CI/CD 変数には登録しない）過去の作業実績の取り直し（§87）
#   FETCH_MODE          （任意。Run pipeline で入れる。CI/CD 変数には登録しない）initial = 初回の取り込み（今年度の初めから今月まで。§96）
#   GIT_PUSH_TOKEN      data/ の取り込み結果を MR で反映するための Project Access Token
#                       （role: Maintainer = 自動マージに必要、scope: write_repository。Protected + Masked）
#   NPM_CONFIG_REGISTRY （任意）社内ミラーの npm レジストリ URL。例: https://nexus.example.local/repository/npm/
#   YOJITSU_RUN_TESTS   （任意）"1" にすると test ジョブ（型チェック・運用のテスト）も動く。既定は動かさない
#   YOJITSU_MR_BUILD    （任意）"1" にすると MR でも毎回 build を動かす（データだけの MR でも。既定はデータだけなら validate だけ）
#   YOJITSU_FULL_BUILD  （任意）"1" にすると build がキャッシュを使わずに全部作り直す（Run pipeline で入れてもよい）
#   NODE_IMAGE          （任意）Node のイメージ。Docker Hub に出られないときは社内レジストリのものを指定する
#   NODE_EXTRA_CA_CERTS （任意）社内の証明書（PEM）。種類を File にして中身を貼る（npm・Node がこの証明書も信頼する）
#   NODE_USE_SYSTEM_CA  （任意）"1" で OS の証明書ストア（Windows の証明書ストアなど）も信頼する。Node 22.19 以降。docs/DEPLOY_GITLAB.md「社内の証明書」
#   以下 2 つは YOJITSU_RUN_TESTS=1 のときだけ使う
#   VITEST_MAX_FORKS    （任意）テストを同時に動かす数（既定 Windows 2・Linux は CPU の数 - 1）。Windows の Runner で安定しないとき 1
#   YOJITSU_TEST_TIMEOUT_SCALE（任意）テストのタイムアウトの倍率（既定 Windows 3・Linux 1）。手順は docs/OPERATIONS.md
#
# 外部ネットワーク:
#   - 画面は外部 CDN を一切使わない（ライブラリは dist/ に同梱）
#   - ビルドも外部に出ない（npm の prebuild で scripts/seed-npm-cache.mjs が Framework のバージョン問い合わせを止める）
#   - 外に出るのは npm ci（NPM_CONFIG_REGISTRY で社内ミラーに向けられる。依存込みで作ったプロジェクトは vendor/npm-cache から入れるので出ない）とイメージの取得だけ
#   - 手順は docs/DEPLOY_GITLAB.md
#
# Runner の OS:
#   - Windows・Linux のどちらの Runner でも動く（社内の Runner は Windows。Linux に変わってもこのままでよい）。
#     そのため script には OS ごとのシェル（sh / PowerShell）で書き方が変わるもの（if・変数の展開・find など）を書かず、
#     node scripts/ci/*.mjs と npm run だけを並べる。変数は variables: で渡す
#   - image: は Docker executor のときだけ使われる（shell executor では無視され、Runner のマシンの Node を使う）
#
# 注意:
#   - Pages のジョブ名は必ず `pages`、成果物は `public/` にする（GitLab の仕様）
#   - 社内 GitLab のイメージレジストリ経由で node:22 を使う場合は CI/CD 変数 NODE_IMAGE で差し替える

image: $NODE_IMAGE

# 社内向けの設定（ランナーのタグ・社内だけのジョブなど）は .gitlab-ci.local.yml に書く。update はそのファイルを上書きしない（SPEC §91.1）。
# このファイルに書いてしまった社内の設定は yojitsu-navi migrate-ci で移せる。書いたら npm run ci:check で確かめる（SPEC §91.3・§91.4）
# レジストリ・証明書・イメージは CI/CD 変数（NPM_CONFIG_REGISTRY・NODE_EXTRA_CA_CERTS・NODE_USE_SYSTEM_CA・NODE_IMAGE）か .npmrc で渡す
include:
  - local: .gitlab-ci.local.yml

# パイプラインの重複を防ぐ: MR があるブランチへの push は MR のパイプラインだけにする
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - test
  - build
  - pages

variables:
  # CI/CD 変数で上書きできる（例: registry.gitlab.example.local/mirror/node:22）
  NODE_IMAGE: "node:22"
  # npm のキャッシュをプロジェクト内に置いて cache: で共有する
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: "20"

# npm のダウンロードキャッシュを lock ファイル単位で共有する。
# node_modules/ は入れない（npm ci は毎回 node_modules を消して入れ直すので、固めて戻す時間がまるごと無駄になる。
# Windows の Runner ではファイル数の多い node_modules の圧縮・展開だけで数分かかる。SPEC §79.3）
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

default:
  before_script:
    # npm ci。依存込みのパッケージ（yojitsu-navi-<版>-with-deps.tgz）で作ったプロジェクトは、同梱のキャッシュだけで入れる
    # （npm ci --offline --cache vendor/npm-cache。外に出ない。SPEC §44）。社内ミラーは NPM_CONFIG_REGISTRY で切り替わる
    - node scripts/ci/install.mjs

# ジョブを選ぶためのファイルの分け方（rules: の changes: で使う。GitLab は MR なら対象ブランチとの差分、push なら前回の push との差分で見る。
# Run pipeline・API などの push 以外では、changes: は常に「変わった」になる）
.yojitsu-changes:
  # プログラム（パッケージの更新で変わるもの）
  app: &app-changes
    - src/**/*
    - scripts/**/*
    - tests/**/*
    - vendor/**/*
    - package.json
    - package-lock.json
    - observablehq.config.js
    - tsconfig.json
    - vitest.config.ts
    - .npmrc
  # データ（導入先が日々変えるもの）
  data: &data-changes
    - data/**/*
    - config.json
  # CI の設定（ランナーのタグなどを変えたら、既定ブランチで一度ビルドと公開まで通す）
  ci: &ci-changes
    - .gitlab-ci.yml
    - .gitlab-ci.local.yml

# --------------------------------------------------------------------------
# validate: MR でデータ（data/・config.json）だけが変わったときのデータ検証。ビルドはしない（マージ後に既定ブランチで build する）
#   マスタ編集の保存・取り込みの自動 MR（fetch-*）はこれだけが動く。プログラムも変わった MR は build（検証つき）が動くので動かさない
# --------------------------------------------------------------------------
validate:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $YOJITSU_MR_BUILD == "1"
      when: never
    - changes: *app-changes
      when: never
    - changes: *data-changes
  script:
    - npm run validate

# --------------------------------------------------------------------------
# ci-check: MR でプログラムもデータも変わっていない（文書・CI の設定だけ）ときの、CI の設定の点検。
#   Node の標準モジュールだけで動くので依存を取らない。MR に必ず 1 つはジョブがあるようにする役目もある
#   （ジョブが 1 つも無いとパイプラインが作られず、「パイプラインの成功が必要」の設定では MR をマージできない）
# --------------------------------------------------------------------------
ci-check:
  stage: validate
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
      when: never
    - if: $YOJITSU_MR_BUILD == "1"
      when: never
    - changes: *app-changes
      when: never
    - changes: *data-changes
      when: never
    - when: on_success
  variables:
    GIT_DEPTH: "1"
  before_script: []
  cache: []
  script:
    - node scripts/ci/check.mjs

# --------------------------------------------------------------------------
# test: 型チェックとテスト。既定は動かさない（CI/CD 変数 YOJITSU_RUN_TESTS=1、または Run pipeline で入れたときだけ）
#   アプリ本体の確認はパッケージの公開前に済ませている。社内の Runner で本体を確かめたいとき（版を上げた直後など）に使う
# --------------------------------------------------------------------------
test:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $YOJITSU_RUN_TESTS != "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  # Windows の Runner では同時に動かすテストを 2 つにしている（vitest.config.ts）。それでもワーカーのタイムアウトが出るときは
  # CI/CD 変数 VITEST_MAX_FORKS を 1 にする（docs/OPERATIONS.md、SPEC §79.1）
  script:
    - npm run typecheck
    # JUnit 形式のレポートも出して GitLab のテスト結果タブに表示する
    - npx vitest run --reporter=default --reporter=junit --outputFile=test-results/junit.xml
  artifacts:
    when: always
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# --------------------------------------------------------------------------
# build: データの整合性チェック（案件ID重複・期間逆転・未知のチーム等で止める）→ 静的サイトを dist/ に生成
# --------------------------------------------------------------------------
build:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # MR: プログラムが変わったときだけ（データだけなら validate、それ以外は ci-check）。YOJITSU_MR_BUILD=1 なら毎回
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $YOJITSU_MR_BUILD == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *app-changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # push（MR のマージを含む）: プログラム・データ・CI の設定のどれかが変わったときだけ（文書だけなら動かさない）
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: *app-changes
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: *data-changes
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: *ci-changes
    - if: $CI_PIPELINE_SOURCE == "push"
      when: never
    # Run pipeline・API など
    - if: $CI_COMMIT_BRANCH
  variables:
    # マスタ編集（src/data/masters.json.ts）が各 CSV の最終コミット ID を履歴から取るため、浅いクローンにしない
    # （浅いと ID を取れず、GitLab 保存時の競合検出が効かない）
    GIT_DEPTH: "0"
    # マスタ編集の保存先（config.json の apiBaseUrl・projectId が空のとき）をこのプロジェクトにする（§39.1）
    YOJITSU_GITLAB_API_URL: $CI_API_V4_URL
    YOJITSU_GITLAB_PROJECT: $CI_PROJECT_PATH
  # 1 つ目は npm のダウンロード（全体の cache: と同じ。ジョブに cache: を書くと全体の分は使われないので並べる）、
  # 2 つ目はローダのキャッシュ（増分ビルド。SPEC §102）。中身は入力の指紋で確かめてから使うので、古い・壊れたキャッシュが戻っても
  # 古い数字は公開されない（合わなければ捨てて作り直す）。保護ブランチ（main）と MR のブランチでは GitLab が別のキャッシュにする
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
    - key: yojitsu-navi-build
      paths:
        - src/.observablehq/cache/
  script:
    - npm run validate
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# --------------------------------------------------------------------------
# pages: 既定ブランチの dist/ を public/ として公開
# --------------------------------------------------------------------------
pages:
  stage: pages
  needs: ["build"]
  # build と同じ条件（build が動かないパイプラインに pages だけがあると、パイプラインが作れない）
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: *app-changes
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: *data-changes
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: *ci-changes
    - if: $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: on_success
  # build の成果物を移すだけなので、npm ci・キャッシュは不要（移すスクリプトのためにリポジトリは浅く取る）
  variables:
    GIT_DEPTH: "1"
  before_script: []
  cache: []
  script:
    # dist/ を public/ に移し、圧縮版（.gz）を並べる（GitLab Pages が gzip で配信し、約 3 MB の JSON が数百 KB になる）
    - node scripts/ci/pages.mjs
  artifacts:
    paths:
      - public/
  # 公開先は https://<group>.pages.example/<project>/（サブパス配信。observablehq.config.js 側で相対パスを使う）
  # 閲覧制限は Settings > General > Visibility > Pages = Only Project Members（docs/DEPLOY_GITLAB.md）
  environment:
    name: pages
    url: $CI_PAGES_URL

# --------------------------------------------------------------------------
# fetch-worklogs: スケジュール実行（例: 平日 06:00）で作業実績を取り直し、MR で反映する
#   Settings > CI/CD > Schedules で cron を登録する（対象ブランチ = 既定ブランチ）
# --------------------------------------------------------------------------
fetch-worklogs:
  stage: validate
  resource_group: data-writeback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # 過去の取り直し（§87）: Run pipeline で FETCH_FROM / FETCH_TO（YYYY-MM）、必要なら FETCH_MEMBERS（社員番号）を入れて実行
    - if: $CI_PIPELINE_SOURCE == "web" && $FETCH_FROM
    # 初回の取り込み（§96）: Run pipeline で FETCH_MODE = initial を入れて実行（今年度の初めから今月まで）
    - if: $CI_PIPELINE_SOURCE == "web" && $FETCH_MODE
  variables:
    GIT_STRATEGY: clone
  script:
    # 直近 refetchMonths か月（手動実行なら FETCH_FROM〜FETCH_TO、FETCH_MODE=initial なら今年度の初めから今月まで）を取り直して data/worklogs/ を更新 → 検証 →
    # 取得に失敗したら CSV は書き換えず、失敗の記録（_meta.json）だけを MR にしてジョブを失敗にする（データ確認画面に出る）
    # main は直接プッシュ不可（保護ブランチ）なので、data/worklogs-<日時> の MR を作って自動マージする（scripts/ci/push-data-mr.mjs）
    - node scripts/ci/fetch-data.mjs worklogs

# --------------------------------------------------------------------------
# fetch-members: 所属・役職を人事データから取り込み、data/masters/members.csv に書き戻す
#   既定は無効。スケジュール実行 かつ CI/CD 変数 MEMBER_FETCH_ENABLED=1 のときだけ動く。
#   config.json の memberSource.adapter が none のままなら何もしない（変更なし）。
#   変わった人だけ実行月の行が追加される（冪等）。fetch-worklogs と同時に動かないよう resource_group を共有する
# --------------------------------------------------------------------------
fetch-members:
  stage: validate
  resource_group: data-writeback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MEMBER_FETCH_ENABLED == "1"
  variables:
    GIT_STRATEGY: clone
  script:
    # fetch:members → 検証 → fetch-worklogs とは別の MR（data/members-<日時>）。触るファイルが違うので互いに競合しない
    - node scripts/ci/fetch-data.mjs members

# --------------------------------------------------------------------------
# fetch-projects: 外部の案件管理システムから正式な案件の一覧（data/projects.csv）を取り込み、
#   案件ID（project_id）のある契約の顧客名・案件名を data/contracts.csv に書き戻す（期間・金額・担当チームは触らない。§98）
#   既定は無効。スケジュール実行 かつ CI/CD 変数 PROJECT_FETCH_ENABLED=1 のとき、または Run pipeline で PROJECT_FETCH=1 を入れたときだけ動く。
#   config.json の projectSource.adapter が none のままなら何もしない（変更なし）
# --------------------------------------------------------------------------
fetch-projects:
  stage: validate
  resource_group: data-writeback
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PROJECT_FETCH_ENABLED == "1"
    - if: $CI_PIPELINE_SOURCE == "web" && $PROJECT_FETCH == "1"
  variables:
    GIT_STRATEGY: clone
  script:
    # fetch:projects → 検証 → 別の MR（data/projects-<日時>）。失敗したら CSV は書き換えず、失敗の記録だけを MR にする
    - node scripts/ci/fetch-data.mjs projects
