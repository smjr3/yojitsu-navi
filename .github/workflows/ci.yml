# 予実ナビ — GitHub Actions（GitHub ミラー／フォーク用。本番の公開は GitLab Pages）
#
# Pull Request と main への push で: 依存インストール → 型チェック → データ検証 → テスト → ビルド → E2E
# E2E は Pull Request では縮小版（@smoke の付いたテストだけ。npm run test:e2e:smoke）、
# main への push（マージ）では全件（npm run test:e2e）。Actions の分数を節約するため。
# 全件は 1 本だと 60 分を超えて打ち切られるので、main では別ジョブ e2e-full で 3 つに分けて（--shard）並べて動かす。
# 作業ブランチへの push だけでは動かさない（Pull Request で動くので二重に走らせない）。
# E2E は tests/e2e/playwright.config.ts が存在するときだけ実行する。

name: CI

# 説明文（*.md）・docs/ だけの変更では動かさない（Actions の分数を使わない）。
# ただし src/ の *.md は画面そのもの（Observable Framework のページ）なので必ず動かす。
# GitHub の paths-ignore は「除外の中の例外」を書けないため、paths に「全部 → 除外 → 例外」の順で書いている（後の行が優先）。
# push と pull_request の一覧は同じにしておく。迷うファイルは動かす側に倒す（除外に足すのは、テスト・ビルド・画面に一切影響しないものだけ）。
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.gitlab-ci.yml"
      - "!.claude/**"
      - "!LICENSE"
      - "!.gitignore"
      - "src/**"
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!.gitlab-ci.yml"
      - "!.claude/**"
      - "!LICENSE"
      - "!.gitignore"
      - "src/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存インストール
        run: npm ci --no-audit --no-fund

      - name: 型チェック
        run: npm run typecheck

      - name: データ検証
        run: npm run validate

      - name: テスト（unit / property / integration）
        run: npm run test

      - name: ビルド
        run: npm run build

      - name: E2E の有無を確認
        id: e2e
        run: |
          if [ -f tests/e2e/playwright.config.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "tests/e2e/playwright.config.ts が無いので E2E はスキップします"
          fi

      - name: Playwright ブラウザのインストール
        if: steps.e2e.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E テスト（縮小版。main の全件は e2e-full）
        if: steps.e2e.outputs.present == 'true'
        run: npm run test:e2e:smoke

      - name: E2E レポートを保存
        if: steps.e2e.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/report/
          if-no-files-found: ignore
          retention-days: 7

      - name: ビルド成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # main への push（マージ）だけ: E2E の全件を 3 分割で並べて動かす
  e2e-full:
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存インストール
        run: npm ci --no-audit --no-fund

      - name: Playwright ブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: E2E テスト（全件の ${{ matrix.shard }}/3）
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: E2E レポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: tests/e2e/report/
          if-no-files-found: ignore
          retention-days: 7
